hard_exclusions:
  - partisan politics
  - election campaigning
  - celebrity scandal
  - public shaming
  - graphic crime
  - culture-war conflict
  - tragedy without resolution
  - fear-driven health stories
  - sport
  - television gossip
  - spirituality
  - memes
  - generic business news

